[project]
name = "dealerwatch-rehearsal"
version = "1.0.0"
description = "Evidence-grounded front-running investigation and human review"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27",
  "networkx>=3.2", "numpy>=1.26", "python-multipart>=0.0.9",
  "openai>=1.40", "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8.0", "playwright>=1.50", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not browser'"
markers = ["browser: real Chromium workflows (run explicitly with -m browser)"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F"]
